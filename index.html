        <style>
            :root {
                --bg: #eef6f3;
                --cd: rgba(255,255,255,.8);
                --tx: #1c2a26;
                --mu: #5d6e68;
                --bd: #cfdad5;
                --gl: rgba(255,255,255,.55);
                --bo: #1f3d36;
                --ch: #f2c94c;
                --as: #e0a100;
                --mt: #2f7fd1;
                --ga: #0b6e8a;
                --gb: #1db98a;
                --gc: #1565c0;
                --gd: #12b886;
                --ab: .5;
                --ease: cubic-bezier(.22,.8,.2,1);
                --meal-card: rgba(255,255,255,.88);
                --meal-bd: #cfdad5;
                --meal-tx: #1c2a26;
                --meal-mu: #5d6e68;
                --meal-item: rgba(28,42,38,.05);
                --meal-ctl-bg: #ffffff;
                --meal-ctl-bd: #cfdad5;
                --meal-ctl-tx: #1c2a26;
                --meal-shadow: 0 8px 24px rgba(0,0,0,.08);
                color-scheme: light
            }

            @media(prefers-color-scheme: dark) {
                :root:not([data-theme=light]) {
                    --bg:#0e1614;
                    --cd: rgba(18,30,34,.76);
                    --tx: #e6eeea;
                    --mu: #9bb0a8;
                    --bd: #2c3a35;
                    --gl: rgba(255,255,255,.13);
                    --bo: #0e2823;
                    --ga: #06222e;
                    --gb: #0a4a3d;
                    --gc: #0b2a5e;
                    --gd: #0a5c4a;
                    --meal-card: rgba(13,35,45,.92);
                    --meal-bd: rgba(255,255,255,.08);
                    --meal-tx: #e8f0f2;
                    --meal-mu: #b9cbd0;
                    --meal-item: rgba(255,255,255,.035);
                    --meal-ctl-bg: #183b49;
                    --meal-ctl-bd: #45616c;
                    --meal-ctl-tx: #e8f0f2;
                    --meal-shadow: 0 8px 24px rgba(0,0,0,.12);
                    --ab: .3;
                    color-scheme: dark
                }
            }

            :root[data-theme=dark] {
                --bg: #0e1614;
                --cd: rgba(18,30,34,.76);
                --tx: #e6eeea;
                --mu: #9bb0a8;
                --bd: #2c3a35;
                --gl: rgba(255,255,255,.13);
                --bo: #0e2823;
                --ga: #06222e;
                --gb: #0a4a3d;
                --gc: #0b2a5e;
                --gd: #0a5c4a;
                --meal-card: rgba(13,35,45,.92);
                --meal-bd: rgba(255,255,255,.08);
                --meal-tx: #e8f0f2;
                --meal-mu: #b9cbd0;
                --meal-item: rgba(255,255,255,.035);
                --meal-ctl-bg: #183b49;
                --meal-ctl-bd: #45616c;
                --meal-ctl-tx: #e8f0f2;
                --meal-shadow: 0 8px 24px rgba(0,0,0,.12);
                --ab: .3;
                color-scheme: dark
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                background: #0b6e8a;
                color: var(--tx);
                font: 15px/1.55 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif
            }

            header {
                background: rgba(12,40,50,.55);
                backdrop-filter: blur(8px);
                color: #f4f7f5;
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap
            }

            header b {
                font-size: 18px;
                color: var(--ch)
            }

            nav {
                display: flex;
                gap: 4px;
                padding: 4px 6px;
                width: calc(100% - 24px);
                max-width: 796px;
                margin: 12px auto 0;
                overflow-x: auto;
                background: rgba(255,255,255,.16);
                backdrop-filter: blur(8px);
                border-radius: 10px
            }

            nav button {
                background: none;
                border: 0;
                border-bottom: 3px solid transparent;
                border-radius: 0;
                color: #e3f3ee;
                padding: 8px 14px;
                font-weight: 600
            }

            nav button.on {
                color: #fff;
                border-color: var(--ch)
            }

            main,.box {
                max-width: 820px;
                margin: auto;
                padding: 12px
            }

            .box {
                max-width: 360px;
                margin-top: 8vh
            }

            section,.box {
                background: var(--cd);
                border: 1px solid var(--bd);
                border-radius: 10px
            }

            section {
                padding: 14px 16px;
                margin-bottom: 12px
            }

            h3 {
                margin: 0 0 8px;
                font-size: 16px
            }

            button,.btn {
                background: var(--bo);
                color: #fff;
                border: 0;
                border-radius: 6px;
                padding: 7px 12px;
                font: inherit;
                cursor: pointer
            }

            button.g {
                background: none;
                color: var(--mu);
                border: 1px solid var(--bd);
                padding: 4px 9px;
                font-size: 13px
            }

            input,select,textarea {
                font: inherit;
                color: var(--tx);
                background: var(--bg);
                border: 1px solid var(--bd);
                border-radius: 6px;
                padding: 7px 9px;
                max-width: 100%
            }

            textarea {
                width: 100%
            }

            button:focus-visible,input:focus-visible,select:focus-visible {
                outline: 2px solid var(--mt);
                outline-offset: 1px
            }

            .f,.r {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                align-items: center;
                margin-top: 6px
            }

            .f>input {
                flex: 1 1 140px
            }

            .r {
                justify-content: space-between
            }

            .m {
                color: var(--mu);
                font-size: 13px
            }

            .bd {
                font-style: normal;
                font-size: 12px;
                background: var(--ch);
                color: #2a2200;
                border-radius: 10px;
                padding: 1px 8px
            }

            .ev {
                display: flex;
                gap: 8px;
                align-items: center;
                flex-wrap: wrap;
                padding: 7px 0 7px 10px;
                border-left: 4px solid var(--as);
                margin: 4px 0
            }

            .ev.match {
                border-color: var(--mt)
            }

            .ev>span:last-child {
                margin-left: auto;
                display: flex;
                gap: 4px
            }

            .t {
                display: flex;
                gap: 8px;
                align-items: center;
                padding: 3px 0
            }

            .t span {
                flex: 1
            }

            .dn {
                text-decoration: line-through;
                color: var(--mu)
            }

            .gr {
                display: grid;
                grid-template-columns: repeat(7,1fr);
                gap: 3px;
                margin-top: 8px
            }

            .w {
                text-align: center;
                color: var(--mu);
                font-size: 13px
            }

            .c {
                min-height: 62px;
                border: 1px solid var(--bd);
                border-radius: 6px;
                padding: 2px;
                cursor: pointer;
                overflow: hidden
            }

            .c.td {
                border: 2px solid var(--ch)
            }

            .c small {
                color: var(--mu)
            }

            .ch {
                display: block;
                font-size: 11px;
                line-height: 1.3;
                border-radius: 3px;
                padding: 0 3px;
                margin-top: 2px;
                background: var(--as);
                color: #221b00;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis
            }

            .ch.match {
                background: var(--mt);
                color: #fff
            }

            .ev.assess-item,.ch.assess-item { cursor:pointer }
            .ev.assess-item:hover { background:var(--bg); border-radius:8px }
            .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:10px; margin-top:10px }
            .photo-card img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; border:1px solid var(--bd) }
            .photo-card a { display:block; color:var(--tx); font-size:12px; overflow-wrap:anywhere }
            .photo-modal { position:fixed; inset:0; z-index:1000; background:#000b; display:flex; align-items:center; justify-content:center; padding:16px }
            .photo-modal .panel { width:min(680px,100%); max-height:88vh; overflow:auto; background:var(--cd); color:var(--tx); border:1px solid var(--bd); border-radius:14px; padding:18px }
            .photo-modal .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; position:sticky; top:-18px; background:var(--cd); padding:4px 0 12px }
            #pl ol {
                padding-left: 20px
            }

            body::before,body::after {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1
            }

            body::before {
                background: radial-gradient(circle at 15% 20%,#2ec4b6 0,transparent 45%),radial-gradient(circle at 85% 15%,#3a86ff 0,transparent 50%),linear-gradient(135deg,#0b6e8a,#1db98a)
            }

            body::after {
                background: radial-gradient(circle at 80% 85%,#43e97b 0,transparent 45%),radial-gradient(circle at 20% 80%,#4facfe 0,transparent 50%),linear-gradient(225deg,#1565c0,#12b886);
                animation: dsv 9s ease-in-out infinite alternate
            }

            @keyframes dsv {
                from {
                    opacity: 0
                }

                to {
                    opacity: 1
                }
            }

            @keyframes dis {
                from {
                    opacity: 0;
                    filter: blur(8px)
                }

                to {
                    opacity: 1;
                    filter: blur(0)
                }
            }

            .dis {
                animation: dis .6s ease
            }

            @media(prefers-reduced-motion:reduce) {
                body::after {
                    animation: none;
                    opacity: .5
                }

                .dis {
                    animation: none
                }
            }

            #app {
                position: relative;
                z-index: 1
            }

            body::before {
                background: linear-gradient(135deg,var(--ga),var(--gb))
            }

            body::after {
                background: linear-gradient(225deg,var(--gc),var(--gd))
            }

            .aurora {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                overflow: hidden
            }

            .aurora i {
                position: absolute;
                width: 55vmax;
                height: 55vmax;
                border-radius: 50%;
                filter: blur(80px);
                opacity: var(--ab);
                animation: drift 18s ease-in-out infinite alternate
            }

            .aurora i:nth-child(1) {
                background: #3a86ff;
                left: -15vmax;
                top: -20vmax
            }

            .aurora i:nth-child(2) {
                background: #43e97b;
                right: -20vmax;
                top: 10vmax;
                animation-delay: -6s
            }

            .aurora i:nth-child(3) {
                background: #06b6d4;
                left: 20vw;
                bottom: -30vmax;
                animation-delay: -12s
            }

            @keyframes drift {
                to {
                    transform: translate(6vmax,4vmax) scale(1.15)
                }
            }

            @keyframes pgIn {
                from {
                    opacity: 0;
                    filter: blur(14px);
                    transform: scale(1.03)
                }

                to {
                    opacity: 1;
                    filter: blur(0);
                    transform: none
                }
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(24px)
                }
            }

            @keyframes float {
                50% {
                    transform: translateY(-6px)
                }
            }

            @keyframes shine {
                to {
                    background-position: 200% center
                }
            }

            section,.box {
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                border: 1px solid var(--gl);
                border-radius: 16px;
                box-shadow: 0 10px 34px rgba(0,30,40,.18)
            }

            .box {
                animation: fadeUp .8s var(--ease) .1s backwards
            }

            .dis {
                animation: pgIn .75s var(--ease) backwards
            }

            .dis section {
                animation: fadeUp .7s var(--ease) backwards
            }

            .dis section:nth-child(n+2) {
                animation-delay: .08s
            }

            .dis section:nth-child(n+3) {
                animation-delay: .16s
            }

            .dis section:nth-child(n+4) {
                animation-delay: .24s
            }

            .dis section:nth-child(n+5) {
                animation-delay: .32s
            }

            .sh {
                background: linear-gradient(90deg,#fff,#a7f3d0,#bae6fd,#fff);
                background-size: 200% auto;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                animation: shine 7s linear infinite
            }

            .fl {
                display: inline-block;
                animation: float 5s ease-in-out infinite
            }

            button {
                transition: transform .25s var(--ease),filter .2s,background .2s
            }

            button:hover {
                transform: translateY(-1px);
                filter: brightness(1.12)
            }

            .c {
                background: color-mix(in srgb,var(--tx) 5%,transparent);
                transition: transform .25s var(--ease)
            }

            .c:hover {
                transform: scale(1.05);
                position: relative;
                z-index: 1
            }

            .ev {
                transition: transform .25s var(--ease)
            }

            .ev:hover {
                transform: translateX(3px)
            }

            .fab {
                position: fixed;
                left: 16px;
                bottom: 16px;
                z-index: 50;
                width: 46px;
                height: 46px;
                border-radius: 50%;
                padding: 0;
                font-size: 20px;
                background: var(--cd);
                color: var(--tx);
                border: 1px solid var(--gl);
                backdrop-filter: blur(14px)
            }

            .fab:hover {
                transform: rotate(60deg)
            }

            .pop {
                position: fixed;
                left: 16px;
                bottom: 72px;
                z-index: 50;
                width: min(270px,calc(100vw - 32px));
                padding: 14px;
                border-radius: 16px;
                background: var(--cd);
                color: var(--tx);
                border: 1px solid var(--gl);
                backdrop-filter: blur(18px);
                box-shadow: 0 18px 50px rgba(0,0,0,.3);
                opacity: 0;
                visibility: hidden;
                transform: translateY(10px) scale(.97);
                transition: opacity .3s,transform .3s var(--ease),visibility .3s
            }

            .pop.on {
                opacity: 1;
                visibility: visible;
                transform: none
            }

            .sg {
                display: flex;
                gap: 4px;
                margin: 10px 0
            }

            .sg button {
                flex: 1;
                background: none;
                color: var(--tx);
                border: 1px solid var(--bd);
                padding: 8px 2px;
                font-size: 13px
            }

            .sg button.on {
                background: var(--bo);
                color: #fff;
                border-color: var(--ch)
            }

            html[data-fx=off] *,html[data-fx=off] ::before,html[data-fx=off] ::after {
                animation: none!important;
                transition: none!important
            }

            html[data-fx=off] .aurora {
                display: none
            }

            html[data-fx=off] body::after {
                opacity: .5
            }

            @media(prefers-reduced-motion:reduce) {
                *,::before,::after {
                    animation: none!important
                }

                body::after {
                    opacity: .5
                }
            }

            .ttl {
                margin: 9vh 12px 0;
                text-align: center;
                font-size: clamp(30px,8vw,48px);
                font-weight: 900;
                line-height: 1.2;
                letter-spacing: -.03em;
                filter: drop-shadow(0 4px 18px rgba(0,30,40,.35));
                animation: fadeUp .8s var(--ease) backwards,shine 7s linear infinite
            }

            .ttl+.box {
                margin-top: 20px
            }

            html {
                -webkit-text-size-adjust: 100%
            }

            * {
                -webkit-tap-highlight-color: transparent
            }

            body {
                min-height: 100dvh;
                overflow-x: hidden
            }

            header {
                padding: calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))
            }

            main {
                padding: 12px max(12px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))
            }

            .fab {
                left: max(16px,env(safe-area-inset-left));
                bottom: calc(16px + env(safe-area-inset-bottom))
            }

            .pop {
                left: max(16px,env(safe-area-inset-left));
                bottom: calc(72px + env(safe-area-inset-bottom))
            }

            button,input,select,textarea {
                touch-action: manipulation
            }

            input,select,textarea {
                font-size: 16px;
                min-height: 44px
            }

            button {
                min-height: 44px
            }

            button.g {
                min-height: 40px
            }

            input[type=checkbox] {
                width: 22px;
                height: 22px;
                min-height: 0;
                flex: none
            }

            input[type=date] {
                -webkit-appearance: none;
                appearance: none
            }

            nav {
                scrollbar-width: none
            }

            nav::-webkit-scrollbar {
                display: none
            }

            nav button {
                white-space: nowrap
            }

            .aurora i {
                will-change: transform
            }

            @media(max-width: 520px) {
                nav button {
                    flex:1 0 auto;
                    padding: 10px 8px
                }

                .f>input,.f>select,.f>button {
                    flex: 1 1 100%;
                    min-width: 0
                }

                .ev>span:last-child {
                    margin-left: 0;
                    flex: 1 1 100%;
                    flex-wrap: wrap
                }

                .gr {
                    gap: 2px
                }

                .c {
                    min-height: 54px;

                }

                }

                }

                }
            }

            @media(max-height: 520px) {
                .ttl {
                    margin-top:3vh;
                    font-size: clamp(24px,7vw,34px)
                }

                .ttl+.box {
                    margin-top: 10px
                }

                .box {
                    margin-top: 3vh
                }
            }

            .br {
                display: flex;
                align-items: center;
                gap: 10px
            }

            .lg {
                width: 42px;
                height: 42px;
                flex: none;
                filter: drop-shadow(0 2px 6px rgba(0,0,0,.3))
            }

            /* 공지사항 */
            .nbar { display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer; user-select:none }
            .nbar-l { white-space:nowrap; font-weight:700 }
            .nbar-t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
            .nbar-new { font-style:normal; font-size:11px; font-weight:700; background:#e5484d; color:#fff; border-radius:8px; padding:1px 6px; margin-right:4px }
            .ni { padding:10px 0; border-top:1px solid var(--bd) }
            .ni-h { display:flex; gap:6px; align-items:center; flex-wrap:wrap }
            .ni-h button { margin-left:auto }
            .ni-b { margin-top:4px; white-space:pre-wrap; overflow-wrap:anywhere }
            .ni-ph { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; margin-top:8px }
            .ni-ph img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; border:1px solid var(--bd); cursor:zoom-in; display:block; background:var(--bd) }
            .np-row { display:flex; align-items:center; gap:8px; margin:8px 0 0 }
            .np-prev { display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:6px; margin-top:8px }
            .np-prev:empty { display:none }
            .np-prev .np-i { position:relative }
            .np-prev img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; border:1px solid var(--bd); display:block }
            .np-prev .np-x { position:absolute; top:3px; right:3px; width:24px; height:24px; padding:0; border-radius:50%; line-height:1; font-size:13px; background:#000b; color:#fff; border:0 }
            #noticeLightbox { z-index:1100; cursor:zoom-out }
            #noticeLightbox img { max-width:100%; max-height:90vh; border-radius:10px; object-fit:contain }
            /* 특별 배너 */
            .banner-stack { display:grid; gap:10px; margin-bottom:14px }
            .event-banner { position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.28); border-radius:16px; padding:18px 20px; color:#fff; background:linear-gradient(120deg,#123b72,#087f8c); box-shadow:0 12px 30px rgba(0,20,45,.2) }
            .event-banner::after { content:""; position:absolute; width:180px; height:180px; right:-55px; top:-75px; border-radius:50%; background:rgba(255,255,255,.1) }
            .event-banner .banner-tag { font-size:11px; letter-spacing:.12em; font-weight:800; opacity:.82 }
            .event-banner h2 { margin:5px 0 6px; font-size:clamp(19px,3vw,25px); line-height:1.25 }
            .event-banner p { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; opacity:.95 }
            .event-banner .banner-emoji { font-size:28px; margin-right:8px }
            .banner-tools { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px }
            .banner-preview { margin-top:12px }
            /* 시간표 */
            .tt-bar { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px }
            .tt-wrap { overflow-x:auto }
            .tt { width:100%; border-collapse:separate; border-spacing:3px; table-layout:fixed; text-align:center }
            .tt th { font-size:13px; font-weight:600; color:var(--mu); padding:4px 1px }
            .tt th small { display:block; font-size:10px; font-weight:400 }
            .tt thead th:first-child, .tt tbody th { width:38px }
            .tt td { border:1px solid var(--bd); border-radius:8px; padding:5px 1px; height:54px; vertical-align:middle; overflow:hidden }
            .tt td b { display:block; font-size:14px; font-weight:650; line-height:1.25; overflow-wrap:anywhere }
            .tt td i { display:block; font-style:normal; font-size:10px; color:var(--mu) }

            gap: 5px;
            padding: 0;
            border-radius: 10px;

            border-radius: 2px;
            background: #fff;

            width: 42px;

            position: sticky;
            top: 12px;
            flex: 0 0 188px;
            width: 188px;
            margin: 12px 0 0 12px;
            padding: 10px;

            flex-direction: column;
            gap: 4px;
            width: 100%;
            max-width: none;

            text-align: center;
            font-size: 18px;
            line-height: 1;

            letter-spacing: .18em;
            color: rgba(255,255,255,.6);

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: 16px;

        /* 태블릿 (701~1100px): 아이콘만 있는 좁은 사이드바 */

                    if (bmp.close) bmp.close();
                    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
                    if (blob) return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', {type: 'image/jpeg'});
                } catch (e) {
                    console.warn('이미지 압축 실패, 원본 사용', e);
                }
                return file;
            }

                if (room <= 0) return alert(`사진은 최대 ${NOTICE_MAX_PHOTOS}장까지 첨부할 수 있어요.`);
                if (files.length > room) alert(`사진은 최대 ${NOTICE_MAX_PHOTOS}장까지라서 ${room}장만 추가할게요.`);
                if (status) status.textContent = '사진 준비 중...';
                for (const f of files.slice(0, room)) {
                    if (!f.type.startsWith('image/')) { alert(`${f.name}은(는) 이미지가 아니에요.`); continue; }
                    if (f.size > 25 * 1024 * 1024) { alert(`${f.name}은(는) 너무 커요. (25MB 이하)`); continue; }
                    const out = await compressImage(f);
                    if (out.size > 8 * 1024 * 1024) { alert(`${f.name}을(를) 줄이지 못했어요. 다른 사진을 골라 주세요.`); continue; }
                    noticePending.push({file: out, url: URL.createObjectURL(out)});

                renderNoticePreview();

                    throw new Error('Cloudinary 설정이 아직 입력되지 않았습니다.');

            async function delNotice(id) {

            // ===== 건의함: 학급 건의 / 사이트 건의 =====
            // 학생은 자기가 보낸 건의만, 선생님·개발자는 전체를 볼 수 있습니다.
            let SG = [], sgErr = false, sgCat = 'class', sgAnon = false, sgDraft = '', sgFilter = 'all', lastSgAt = 0;
            let stopSuggestions = null, sgKey = '';
            const SG_CAT = { class: '🏫 학급', site: '💻 사이트' };
            const sgStaff = () => !!me && lv() >= 3;

                return rows.length ? rows.map(s => sgItem(s, staff, staff || sgLeader())).join('') : `<p class="m">${staff ? '받은 건의가 없어요.' : sgLeader() ? '볼 수 있는 건의가 없어요.' : '아직 보낸 건의가 없어요.'}</p>`;

            function refreshSuggestions() {

            function startSuggestions() {
                if (!me) return;
                const mode = lv() >= 3 ? 'staff' : lv() === 2 ? 'leader' : 'student';
                const key = me.uid + ':' + mode;
                if (key === sgKey && stopSuggestions) return;
                if (stopSuggestions) { stopSuggestions(); stopSuggestions = null; }
                sgKey = key;
                const onErr = err => {
                    console.error(err);
                    sgErr = true;
                    refreshSuggestions();
                };
                // 읽는 범위가 다른 조회가 둘 이상일 때는 결과를 따로 모아 합칩니다.
                const parts = {};
                const apply = (name, snap) => {
                    parts[name] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                    const merged = new Map();
                    Object.values(parts).forEach(list => list.forEach(s => merged.set(s.id, s)));
                    SG = [...merged.values()];
                    sgErr = false;
                    refreshSuggestions();
                };
                const subs = [];
                if (mode === 'staff') {
                    subs.push(onSnapshot(query(suggestionsRef, orderBy('createdAt', 'desc'), limit(200)), s => apply('all', s), onErr));
                } else {
                    subs.push(onSnapshot(query(suggestionsRef, where('authorUid', '==', me.uid), limit(100)), s => apply('mine', s), onErr));
                    if (mode === 'leader') {
                        subs.push(onSnapshot(query(suggestionsRef, where('category', '==', 'class'), limit(200)), s => apply('class', s), onErr));
                    }
                }
                stopSuggestions = () => subs.forEach(u => u());
            }
            function stopSuggestionsSub() {
                if (stopSuggestions) { stopSuggestions(); stopSuggestions = null; }
                sgKey = '';
                SG = [];
                sgErr = false;
            }
            function sgSetCat(k) { sgCat = k === 'site' ? 'site' : 'class'; render(); }
            function sgSetFilter(k) { sgFilter = ['class', 'site'].includes(k) ? k : 'all'; render(); }
            function sgDraftInput(v) { sgDraft = v; }
            function sgAnonSet(v) { sgAnon = !!v; }
            async function sgSend() {
                if (!me) return;

                if (!text) return alert('건의 내용을 입력해 주세요.');

                if (Date.now() - lastSgAt < 30000) return alert('건의는 30초에 한 번만 보낼 수 있어요. 잠시 후 다시 시도해 주세요.');

            async function sgToggle(id) {

            }
            const sgView = () => {
                const staff = sgStaff();
                const catBtn = k => `<button class="${sgCat === k ? '' : 'g'}" onclick="sgSetCat('${k}')">${SG_CAT[k]}</button>`;
                const cnt = k => SG.filter(s => k === 'all' || s.category === k).length;
                const fBtn = (k, n) => `<button class="${sgFilter === k ? '' : 'g'}" onclick="sgSetFilter('${k}')">${n} ${cnt(k)}</button>`;
                const hint = sgCat === 'class' ? '학급 운영, 자리, 행사, 규칙 등 우리 반에 바라는 점을 적어 주세요. 선생님, 개발자, 반장, 부반장이 볼 수 있어요.' : '사이트의 오류, 불편한 점, 있었으면 하는 기능을 적어 주세요. 선생님과 개발자만 볼 수 있어요.';
                return `<section><h3>💬 건의사항 보내기</h3><div class="f" style="margin-top:0">${catBtn('class')}${catBtn('site')}</div><p class="m">${hint}</p><div class="f" style="margin-top:0"><textarea id="sg-in" rows="4" maxlength="300" placeholder="건의 내용을 입력하세요 (300자 이내)" oninput="sgDraftInput(this.value)">${E(sgDraft)}</textarea></div><label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="sg-anon" type="checkbox" ${sgAnon ? 'checked' : ''} onchange="sgAnonSet(this.checked)" style="width:auto"><span>익명으로 보내기</span></label><div class="f"><button id="sg-btn" onclick="sgSend()">보내기</button></div><p class="m">익명으로 보내면 화면에는 이름이 표시되지 않아요.</p></section><section><h3>${staff ? '📥 받은 건의함' : sgLeader() ? '📥 학급 건의 · 내가 보낸 건의' : '📮 내가 보낸 건의'}</h3>${staff ? `<div class="f" style="margin-top:0">${fBtn('all', '전체')}${fBtn('class', '학급')}${fBtn('site', '사이트')}</div>` : ''}<div id="sg-list">${sgListInner()}</div></section>`;
            };

            const isCleanDay = ds => {
                const w = new Date(ds + 'T00:00:00').getDay();
                return w >= 1 && w <= 5 && !D.cleaning.exceptions.some(x => x.date === ds);
            };
            const boardDutyFor = ds => {
                const c = D.cleaning.boardDuty, n = c.order.length;
                if (!n || !isCleanDay(ds)) return '';
                if (c.overrides[ds]) return c.overrides[ds];
                const skip = new Set(D.cleaning.exceptions.map(x => x.date));
                const [from, to, sign] = ds >= c.anchorDate ? [c.anchorDate, ds, 1] : [ds, c.anchorDate, -1];
                let cnt = 0, t = new Date(from + 'T00:00:00');
                const end = new Date(to + 'T00:00:00');
                for (let i = 0; t < end && i < 800; i++, t = new Date(t.getTime() + 864e5)) {
                    const w = t.getDay();
                    if (w >= 1 && w <= 5 && !skip.has(iso(t))) cnt++;
                }
                return c.order[(((c.anchorIdx + sign * cnt) % n) + n) % n];
            };
            const boardView = () => {
                const c = D.cleaning.boardDuty, adm = lv() >= 3;
                const days = [];
                for (let i = 0; days.length < 7 && i < 45; i++) {

                    ${days.map(([ds, who]) => `<div class="ev"><b>${ds.slice(5)} (${wk(ds)})</b><span>${E(who)}${c.overrides[ds] ? ' <i class="bd">지정</i>' : ''}${ds === TD ? ' <i class="bd">오늘</i>' : ''}</span></div>`).join('') || '<p class="m">예정된 당번이 없어요.</p>'}
                    ${adm ? `<h3 style="margin-top:14px;font-size:14px">날짜별로 직접 지정</h3>
                    <div class="f"><input id="bd-date" type="date" value="${TD}"><select id="bd-name">${c.order.map(n => `<option value="${E(n)}">${E(n)}</option>`).join('')}</select><button onclick="addBoardOverride()">이 날 당번 지정</button></div>
                    ${ov.map(d => `<div class="ev"><b>${E(d)}</b><span>${E(c.overrides[d])}</span><button class="g" onclick="removeBoardOverride('${E(d)}')">해제</button></div>`).join('')}
                    <details style="margin-top:10px"><summary class="m">순번 기준 바꾸기</summary>
                    <div class="f"><input id="bd-anchor-date" type="date" value="${E(c.anchorDate)}"><select id="bd-anchor-name">${c.order.map((n, i) => `<option value="${i}" ${i === c.anchorIdx ? 'selected' : ''}>${E(n)}</option>`).join('')}</select><button onclick="saveBoardAnchor()">기준 저장</button></div>
                    <p class="m">위 날짜에 위 사람이 당번이 되고, 이후 평일(제외일 건너뜀)마다 순서대로 넘어가요.</p></details>` : ''}</section>`;
            };
            const cleanToday = () => {
                    const date = iso(new Date());
                    const weekday = new Date(date + 'T00:00:00').getDay();
                    const excluded = D.cleaning.exceptions.find(x => x.date === date);
                    const group = weekday >= 1 && weekday <= 5 ? D.cleaning.schedule[weekday] : '';
                    const names = (ids) => ids.map(id => nm(id)).join(', ') || '미배정';
                    let todayContent = '';

                        todayContent = `<p><b>오늘은 청소 제외일입니다.</b></p><p class="m">${E(excluded.reason || '등록된 제외 사유가 없습니다.')}</p>`;
                    } else if (!group) {
                        todayContent = '<p class="m">오늘 담당 조가 아직 지정되지 않았습니다.</p>';
                    } else {
                        const cfg = D.cleaning.groups[group] || {};
                        todayContent = `<h3 style="font-size:20px">오늘의 청소 담당: ${group}조</h3>
                            ${Object.entries(CLEAN_ROLE_META).map(([key, meta]) => `<div class="ev"><b>${meta.label}</b><span>${E(names(cfg[key] || []))}</span></div>`).join('')}`;
                    }
                const boardNow = boardDutyFor(date);
                const boardLine = boardNow ? `<p class="m" style="margin:8px 0 0;font-size:13px">🧽 오늘 칠판 당번 <b>${E(boardNow)}</b>${me && me.name === boardNow ? ' <i class="bd">나</i>' : ''}</p>` : '';
                return `<section><h3>🧹 오늘의 청소</h3>${todayContent}${boardLine}</section>`
            };

            const TODAY_DEFAULT = ['notice', 'dday', 'clean', 'duty', 'events', 'todo']
              , TODAY_LABEL = {
                notice: '📢 공지',
                dday: '📝 기말고사 디데이',
                clean: '🧹 오늘의 청소',
                duty: '🎯 내 1인1역',
                events: '📅 7일 안의 일정',
                todo: '✅ 내 할 일'
            }
              , ORD = {}
              , orderKey = () => 'todayOrder:' + (me?.uid || '');
            function todayOrder() {
                let saved = ORD[orderKey()];
                if (!saved) {
                    try {
                        saved = JSON.parse(localStorage.getItem(orderKey()) || '[]')
                    } catch (e) {
                        saved = []
                    }
                }
                if (!Array.isArray(saved))
                    saved = [];
                const valid = saved.filter( (k, i) => TODAY_DEFAULT.includes(k) && saved.indexOf(k) === i);
                return [...valid, ...TODAY_DEFAULT.filter(k => !valid.includes(k))]
            }
            function saveOrder(arr) {
                ORD[orderKey()] = arr;
                try {
                    localStorage.setItem(orderKey(), JSON.stringify(arr))
                } catch (e) {}
            }
            function renderOrderList() {
                const box = document.getElementById('olist');
                if (!box)
                    return;
                const o = todayOrder();
                box.innerHTML = o.map( (k, i) => `<div class="ev"><b>${TODAY_LABEL[k]}</b><span><button class="g" onclick="moveCard(${i},-1)" ${i === 0 ? 'disabled' : ''}>▲</button> <button class="g" onclick="moveCard(${i},1)" ${i === o.length - 1 ? 'disabled' : ''}>▼</button></span></div>`).join('')
            }
            function openOrder() {
                if (document.getElementById('orderModal'))
                    return;
                const modal = document.createElement('div');

                modal.id = 'orderModal';
                modal.innerHTML = `<div class="panel" role="dialog" aria-modal="true"><div class="panel-head"><h2 style="margin:0">↕ 카드 순서 바꾸기</h2><button class="g" onclick="closeOrder()">완료</button></div><p class="m">▲▼를 누르면 오늘 탭 카드 순서가 바로 바뀌어요. 이 기기에 저장돼요.</p><div id="olist"></div><p style="margin-top:10px"><button class="g" onclick="resetOrder()">기본 순서로</button></p></div>`;
                modal.addEventListener('click', ev => {
                    if (ev.target === modal)
                        closeOrder()
                }
                );
                document.body.appendChild(modal);
                renderOrderList()
            }
            function closeOrder() {
                document.getElementById('orderModal')?.remove()
            }
            function moveCard(i, d) {
                const o = todayOrder()
                  , j = i + d;
                if (j < 0 || j >= o.length)
                    return;
                [o[i],o[j]] = [o[j], o[i]];
                saveOrder(o);
                renderOrderList();
                render()
            }
            function resetOrder() {
                saveOrder(TODAY_DEFAULT.slice());
                renderOrderList();
                render()
            }

            // ===== 기말고사 디데이 (오늘 탭 위젯, 켜고 끄기는 사용자 선택) =====
            const EXAM = { name: '기말고사', date: '2026-12-10' };
            const ddayKey = () => 'ddayOn:' + (me?.uid || '');
            const ddayOn = () => { try { return localStorage.getItem(ddayKey()) === '1' } catch (e) { return false } };
            function setDday(on) {
                try { localStorage.setItem(ddayKey(), on ? '1' : '0') } catch (e) {}
                render()
            }
            function ddayCard() {
                const n = dday(EXAM.date)
                  , [, m, d] = EXAM.date.split('-')
                  , wd = '일월화수목금토'[new Date(EXAM.date + 'T12:00:00').getDay()]
                  , big = n > 0 ? 'D-' + n : n === 0 ? 'D-DAY' : 'D+' + (-n)
                  , note = n > 0 ? '' : n === 0 ? ' · 오늘부터 시작해요!' : ' · 시험 기간이 시작됐어요';
                return `<section class="dday-card"><h3>📝 ${E(EXAM.name)} 디데이</h3><div class="dday-num">${big}</div><p class="m">${+m}월 ${+d}일(${wd}) 시작${note}</p></section>`
            }

            // ===== 직접 작성하는 공동 시간표 =====
            // 선생님/개발자가 편집하고 Firestore를 통해 모든 로그인 사용자에게 실시간 공유합니다.
            const TT_DAYS = ['월', '화', '수', '목', '금'];
            const TT_DEFAULT = {
                1: { start: '', times: ['08:40~09:30','09:40~10:30','10:40~11:30','11:40~12:30','13:30~14:20','14:30~15:20','15:30~16:20'], days: Array.from({length:5}, () => Array.from({length:7}, () => ({s:'',t:''}))) },
                2: { start: '', times: ['08:40~09:30','09:40~10:30','10:40~11:30','11:40~12:30','13:30~14:20','14:30~15:20','15:30~16:20'], days: Array.from({length:5}, () => Array.from({length:7}, () => ({s:'',t:''}))) }
            };
            let TT_DATA = JSON.parse(JSON.stringify(TT_DEFAULT));
            let ttWeek = 1;
            let ttSaving = false;
            const ttCanEdit = () => !!me && (me.role === 'teacher' || me.role === 'dev');
            // Firestore는 중첩 배열(배열 안의 배열)을 저장할 수 없어서, 요일별 배열을 d0~d4 키를 가진 맵으로 바꿔 저장합니다.
            const ttForSave = () => {
                const out = {};
                [1,2].forEach(k => {
                    const w = TT_DATA[k];
                    const days = {};
                    w.days.forEach((day, d) => { days['d' + d] = day; });
                    out[k] = { start: w.start, times: w.times, days };
                });
                return out;
            };
            const ttNormalize = raw => {
                const out = {};
                [1,2].forEach(w => {
                    const x = raw && raw[w] ? raw[w] : TT_DEFAULT[w];
                    const count = Math.max(1, Math.min(10, Array.isArray(x.times) ? x.times.length : 7));
                    out[w] = {
                        start: String(x.start || ''),
                        times: Array.from({length:count}, (_,i) => String((x.times || [])[i] || '')),
                        days: Array.from({length:5}, (_,d) => Array.from({length:count}, (_,p) => {
                            const dayArr = Array.isArray(x.days) ? x.days[d] : (x.days || {})['d' + d];
                            const c = ((dayArr || [])[p]) || {};
                            return { s:String(c.s || ''), t:String(c.t || '') };
                        }))
                    };
                });
                return out;
            };
            function ttSetWeek(n) { ttWeek = n === 2 ? 2 : 1; render(); }
            function ttAddPeriod() {
                if (!ttCanEdit()) return;
                const w = TT_DATA[ttWeek];
                if (w.times.length >= 10) return alert('교시는 최대 10교시까지 추가할 수 있어요.');
                w.times.push('');
                w.days.forEach(day => day.push({s:'',t:''}));
                render();
            }
            function ttRemovePeriod() {
                if (!ttCanEdit()) return;
                const w = TT_DATA[ttWeek];
                if (w.times.length <= 1) return alert('최소 1교시는 남겨야 해요.');
                if (!confirm('마지막 교시를 삭제할까요? 해당 교시의 과목과 선생님 정보도 삭제됩니다.')) return;
                w.times.pop();
                w.days.forEach(day => day.pop());
                render();
            }
            async function ttSave() {
                if (!ttCanEdit() || ttSaving) return;
                const root = $('#tt-editor');
                if (!root) return;
                const w = TT_DATA[ttWeek];
                w.start = root.querySelector('#tt-start')?.value || '';
                w.times = w.times.map((_,p) => root.querySelector(`[data-tt-time="${p}"]`)?.value || '');
                w.days = w.days.map((day,d) => day.map((cell,p) => ({
                    s: root.querySelector(`[data-tt-sub="${d}-${p}"]`)?.value.trim() || '',
                    t: root.querySelector(`[data-tt-tea="${d}-${p}"]`)?.value.trim() || ''
                })));
                ttSaving = true;
                const status = $('#tt-save-status');
                if (status) status.textContent = '저장 중...';
                try {
                    await setDoc(timetableRef, { weeks: ttForSave(), updatedAt: Date.now(), updatedBy: me.name || '' }, { merge: true });
                    if (status) status.textContent = '저장 완료 · 모든 사용자에게 반영됐어요.';
                } catch (e) {
                    if (status) status.textContent = '저장 실패: ' + (e.message || 'Firestore 권한을 확인해 주세요.');
                } finally { ttSaving = false; }
            }
            function ttTable(w, editable) {
                const n = w.times.length;
                const head = TT_DAYS.map((d,i) => `<th>${d}</th>`).join('');
                let rows = '';
                for (let p=0; p<n; p++) {
                    rows += `<tr><th>${p+1}${editable ? `<input data-tt-time="${p}" value="${E(w.times[p])}" placeholder="시간" aria-label="${p+1}교시 시간" style="display:block;width:92px;min-width:0;margin:4px auto;font-size:11px;padding:4px">` : (w.times[p] ? `<small>${E(w.times[p])}</small>` : '')}</th>`;
                    rows += w.days.map((day,d) => {
                        const c = day[p] || {s:'',t:''};
                        return `<td class="tt-c">${editable
                            ? `<input data-tt-sub="${d}-${p}" value="${E(c.s)}" placeholder="과목" aria-label="${TT_DAYS[d]}요일 ${p+1}교시 과목" style="width:100%;min-width:68px;box-sizing:border-box;margin-bottom:4px;padding:6px 3px;font-weight:700;text-align:center"><input data-tt-tea="${d}-${p}" value="${E(c.t)}" placeholder="선생님" aria-label="${TT_DAYS[d]}요일 ${p+1}교시 선생님" style="width:100%;min-width:68px;box-sizing:border-box;padding:5px 3px;font-size:11px;text-align:center">`
                            : `${c.s ? `<b>${E(c.s)}</b>` : '<span class="m">-</span>'}${c.t ? `<i>${E(c.t)}</i>` : ''}`
                        }</td>`;
                    }).join('') + '</tr>';
                }
                return `<div class="tt-wrap"><table class="tt"><thead><tr><th>교시</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
            }
            function ttView() {
                const w = TT_DATA[ttWeek] || TT_DEFAULT[ttWeek];
                const editable = ttCanEdit();
                const hasData = w.days.some(day => day.some(c => c.s || c.t));
                const weekBar = `<div class="tt-bar"><button class="${ttWeek===1?'':'g'}" onclick="ttSetWeek(1)">이번 주</button><button class="${ttWeek===2?'':'g'}" onclick="ttSetWeek(2)">다음 주</button></div>`;
                const editor = editable ? `<div id="tt-editor" style="margin-top:12px">
                    <div class="f" style="align-items:center"><label>시간표 시작일<input id="tt-start" type="date" value="${E(w.start)}"></label><span class="m">선생님 또는 개발자 계정으로 편집할 수 있어요.</span></div>
                    ${ttTable(w,true)}
                    <div class="f" style="margin-top:10px"><button class="g" onclick="ttAddPeriod()">＋ 교시 추가</button><button class="g" onclick="ttRemovePeriod()">－ 마지막 교시 삭제</button><button onclick="ttSave()" ${ttSaving?'disabled':''}>${ttSaving?'저장 중…':'시간표 저장'}</button><span id="tt-save-status" class="m"></span></div>
                </div>` : `<div style="margin-top:12px">${hasData ? ttTable(w,false) : '<p class="m">아직 등록된 시간표가 없어요. 선생님께 시간표 작성을 요청해 주세요.</p>'}</div>`;
                return `<section class="tt-card"><h3>🕘 우리 반 시간표</h3>${weekBar}${editor}<p class="m">과목과 선생님 이름을 입력한 뒤 저장하면 같은 사이트의 모든 사용자에게 공유됩니다.</p></section>`;
            }

            // NEIS 기반 급식 조회 (학교 정보는 학교명으로 자동 검색)
            let mealDate = iso(new Date()), mealCache = new Map(), mealLoading = false;
            const mealAllergyNames = {1:'난류',2:'우유',3:'메밀',4:'땅콩',5:'대두',6:'밀',7:'고등어',8:'게',9:'새우',10:'돼지고기',11:'복숭아',12:'토마토',13:'아황산류',14:'호두',15:'닭고기',16:'쇠고기',17:'오징어',18:'조개류',19:'잣'};
            const mealYmd = d => String(d).replaceAll('-','');
            async function loadMeal() {
                const date = document.getElementById('meal-date')?.value || mealDate;
                mealDate = date;
                const box = document.getElementById('meal-result');
                if (!box) return;
                const key = mealYmd(date);
                if (mealCache.has(key)) { box.innerHTML = mealMarkup(mealCache.get(key)); return; }
                box.innerHTML = '<p class="meal-empty">🍱 급식 정보를 불러오는 중...</p>';
                if (mealLoading) return;
                mealLoading = true;
                try {
                    const schoolRes = await fetch('https://kschoolinfo.com/api/v1/schools?name=' + encodeURIComponent('마석고등학교') + '&region=' + encodeURIComponent('경기도') + '&kind=' + encodeURIComponent('고등학교'));
                    if (!schoolRes.ok) throw new Error('학교 정보를 가져오지 못했습니다.');
                    const schoolJson = await schoolRes.json();
                    const schools = Array.isArray(schoolJson.data) ? schoolJson.data : (Array.isArray(schoolJson.schools) ? schoolJson.schools : []);
                    const school = schools.find(x => (x.schoolName || x.name || x.SCHUL_NM) === '마석고등학교') || schools[0];
                    if (!school) throw new Error('마석고등학교 정보를 찾지 못했습니다.');
                    const eduCode = school.eduCode || school.officeCode || school.ATPT_OFCDC_SC_CODE;
                    const schoolCode = school.schoolCode || school.code || school.SD_SCHUL_CODE;
                    if (!eduCode || !schoolCode) throw new Error('학교 코드 정보를 확인할 수 없습니다.');
                    const url = 'https://kschoolinfo.com/api/v1/meals?eduCode=' + encodeURIComponent(eduCode) + '&schoolCode=' + encodeURIComponent(schoolCode) + '&date=' + key + '&type=lunch';
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('급식 정보를 가져오지 못했습니다.');
                    const json = await res.json();
                    if (json.ok === false) throw new Error(json.error?.message || '급식 조회에 실패했습니다.');
                    const rows = Array.isArray(json.data) ? json.data : [];
                    const lunch = rows.find(x => String(x.type?.code || x.type || '') === '2' || String(x.type?.name || '').includes('중식')) || rows[0] || null;
                    mealCache.set(key, lunch);
                    const current = document.getElementById('meal-result');
                    if (current) current.innerHTML = mealMarkup(lunch);
                } catch (err) {
                    const current = document.getElementById('meal-result');
                    if (current) current.innerHTML = `<p class="meal-empty">급식 정보를 불러오지 못했어요.<br><span class="m">${E(err.message || '잠시 후 다시 시도해 주세요.')}</span><br><button class="g" onclick="loadMeal()">다시 시도</button></p>`;
                } finally { mealLoading = false; }
            }
            function mealMarkup(row) {
                if (!row) return '<div class="meal-empty">선택한 날짜에는 등록된 급식이 없어요.</div>';
                const menu = Array.isArray(row.menu) ? row.menu : [];
                const items = menu.map(item => {
                    const name = typeof item === 'string' ? item : (item.name || '');
                    const raw = typeof item === 'object' ? (item.allergens || item.allergy || []) : [];
                    const codes = (Array.isArray(raw) ? raw : String(raw).split(/[,.\\s]+/))
                        .map(a => String(typeof a === 'object' ? (a.code || a.id || '') : a).trim())
                        .filter(Boolean);
                    const suffix = codes.length ? ` (${codes.join('.')})` : '';
                    return `<li>${E(name)}${E(suffix)}</li>`;
                }).join('');
                const calories = row.calories ? `${E(row.calories)} Kcal` : '열량 정보 없음';
                return `<ul class="meal-list">${items || '<li>메뉴 정보가 없습니다.</li>'}</ul><p class="meal-calories">칼로리: ${calories}</p>`;
            }
            const canManageBanners = () => !!me && ['teacher','dev','pres','vice'].includes(me.role);
            const bannerPrefKey = () => `maseok_banner_visible_${me?.uid || 'guest'}`;
            const bannersVisible = () => {
                try { return localStorage.getItem(bannerPrefKey()) !== '0'; }
                catch (_) { return true; }
            };
            function toggleBannerVisibility() {
                try {
                    localStorage.setItem(bannerPrefKey(), bannersVisible() ? '0' : '1');
                } catch (_) {}
                render();
            }
            const bannerDisplay = () => {
                if (!bannersVisible()) return '';
                const active = BANNERS.filter(b => b.active !== false && (!b.endDate || b.endDate >= iso(new Date())));
                if (!active.length) return '';
                return `<div class="banner-stack">${active.map(b => `<article class="event-banner"><div class="banner-tag">${E(b.category || 'SPECIAL NOTICE')}</div><h2><span class="banner-emoji">${E(b.emoji || '📣')}</span>${E(b.title || '특별 소식')}</h2><p>${E(b.content || '')}</p>${b.authorName ? `<div class="m" style="color:#ffffffb8;margin-top:9px">작성 · ${E(b.authorName)}</div>` : ''}</article>`).join('')}</div>`;
            };
            function bannerManagerView() {
                if (!canManageBanners()) return '<section><p>배너 관리 권한이 없습니다.</p></section>';
                return `<section><h3>🎉 특별 배너 만들기</h3>
                    <p class="m">대항전 결과, 행사 순위, 학급 소식 등을 알리는 배너입니다. 반장·부반장·선생님이 등록·수정·삭제할 수 있습니다.</p>
                    <div class="f"><select id="bn-category"><option>대항전</option><option>행사</option><option>수상·순위</option><option>학급 소식</option><option>기타</option></select>
                    <select id="bn-emoji"><option>📣</option><option>🏆</option><option>🥇</option><option>🥈</option><option>🥉</option><option>🎉</option><option>🔥</option><option>💪</option><option>👏</option><option>⚡</option><option>📢</option><option>🎊</option><option>😢</option><option>💙</option><option>⭐</option></select></div>
                    <div class="f"><input id="bn-title" maxlength="60" placeholder="배너 제목 (예: 대항전 우승!)" style="flex:1 1 100%"></div>
                    <textarea id="bn-content" rows="3" maxlength="500" placeholder="배너 내용 (최대 500자)"></textarea>
                    <div class="f"><label class="t"><input id="bn-active" type="checkbox" checked><span>게시하기</span></label><label class="t"><span>게시 종료일 (선택)</span><input id="bn-end" type="date"></label></div>
                    <div class="banner-preview"><button onclick="saveBanner()">배너 등록</button></div></section>
                    <section><h3>🗂 배너 관리</h3>${BANNERS.length ? BANNERS.map(b => `<div class="ev" style="align-items:flex-start"><div style="flex:1;min-width:180px"><b>${E(b.emoji || '📣')} ${E(b.title)}</b><div class="m">${E(b.category || '')} · ${b.active === false ? '비공개' : '게시 중'}${b.endDate ? ' · 종료 '+E(b.endDate) : ''}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${E(b.content || '')}</div></div><span><button class="g" onclick="toggleBanner('${E(b.id)}',${b.active === false ? 'true' : 'false'})">${b.active === false ? '게시' : '숨기기'}</button><button class="g" onclick="editBanner('${E(b.id)}')">수정</button><button class="g" onclick="deleteBanner('${E(b.id)}')">삭제</button></span></div>`).join('') : '<p class="m">등록된 배너가 없습니다.</p>'}</section>`;
            }
            async function saveBanner() {
                if (!canManageBanners()) return alert('배너 관리 권한이 없습니다.');
                const title = ($('#bn-title')?.value || '').trim(), content = ($('#bn-content')?.value || '').trim();
                if (!title || !content) return alert('제목과 내용을 모두 입력해 주세요.');
                const id = uid();
                try {
                    await setDoc(doc(bannersRef, id), { id, title, content, category: $('#bn-category').value, emoji: $('#bn-emoji').value, active: $('#bn-active').checked, endDate: $('#bn-end').value || '', authorUid: me.uid, authorName: me.name, createdAt: Date.now(), updatedAt: Date.now() });
                    alert('배너를 등록했습니다.');
                } catch(e) { alert(e.message || '배너 등록에 실패했습니다.'); }
            }
            async function toggleBanner(id, active) {
                if (!canManageBanners()) return alert('권한이 없습니다.');
                try { await updateDoc(doc(bannersRef,id), {active, updatedAt:Date.now()}); } catch(e) { alert(e.message || '변경에 실패했습니다.'); }
            }
            async function editBanner(id) {
                if (!canManageBanners()) return;
                const b = BANNERS.find(x => x.id === id); if (!b) return;
                const title = prompt('배너 제목', b.title || ''); if (title === null) return;
                const content = prompt('배너 내용', b.content || ''); if (content === null) return;
                const emoji = prompt('이모지 (예: 🏆 🎉 📣)', b.emoji || '📣'); if (emoji === null) return;
                try { await updateDoc(doc(bannersRef,id), {title:title.trim(), content:content.trim(), emoji:emoji.trim() || '📣', updatedAt:Date.now()}); }
                catch(e) { alert(e.message || '수정에 실패했습니다.'); }
            }
            async function deleteBanner(id) {
                if (!canManageBanners() || !confirm('이 배너를 삭제할까요?')) return;
                try { await deleteDoc(doc(bannersRef,id)); } catch(e) { alert(e.message || '삭제에 실패했습니다.'); }
            }

            const V = {
                today() {
                    const up = upc(7)
                      , td = D.todos[me.uid] || [];
                    const B = {
                        notice: noticeBar,
                        dday: ddayCard,
                        clean: cleanToday,
                        duty: () => `<section><h3>🎯 내 1인1역</h3>${me.duty ? `<p style="margin:4px 0;font-size:17px"><b>${E(me.duty)}</b></p>` : '<p class="m">아직 정해진 역할이 없어요. 선생님께 물어보세요.</p>'}</section>`,
                        events: () => `<section><h3>📅 7일 안의 일정</h3>${up.map(e => evRow(e)).join('') || '<p class="m">예정된 일정이 없어요.</p>'}</section>`,
                        todo: () => `<section><h3>✅ 내 할 일</h3>${td.map( (t, i) => `<label class="t"><input type="checkbox" ${t.d ? 'checked' : ''} onchange="tg(${i})"><span class="${t.d ? 'dn' : ''}">${E(t.t)}</span><button class="g" onclick="dl(${i})">삭제</button></label>`).join('')}<div class="f"><input id="nt" placeholder="할 일 입력 후 Enter" onkeydown="if(event.key=='Enter')ad()"><button onclick="ad()">추가</button></div></section>`,
                    };
                    return `<div class="dashboard-grid">${todayOrder().filter(k => B[k] && (k !== 'dday' || ddayOn())).map(k => B[k]()).join('\n')}</div><p class="dashboard-order" style="text-align:center;margin:6px 0 24px"><button class="g" onclick="openOrder()">↕ 카드 순서 바꾸기</button> <button class="g" onclick="setDday(${!ddayOn()})">📝 기말고사 디데이 ${ddayOn() ? '끄기' : '켜기'}</button></p>`
                },
                timetable() {
                    return ttView()
                },
                suggest() {
                    return sgView()
                },

                            if (seen.has(id)) return alert(`${g}조에서 같은 학생이 여러 역할에 중복 배정되어 있습니다.`);
                            seen.add(id);
                        }
                        next.groups[g][role] = ids;
                    }
                }
                for (const day of [1, 2, 3, 4, 5]) {
                    const select = $(`#clean-day-${day}`);
                    if (select) next.schedule[day] = select.value;
                }
                D.cleaning = next;
                await saveCleaning();
                alert('청소 담당자와 요일별 담당 조를 저장했습니다.');
                render();
            }
            async function addBoardOverride() {
                if (lv() < 3) return alert('선생님 또는 개발자만 수정할 수 있습니다.');
                const date = $('#bd-date')?.value, name = $('#bd-name')?.value;
                if (!date || !name) return alert('날짜와 당번을 선택해 주세요.');
                D.cleaning.boardDuty.overrides[date] = name;
                await saveCleaning();
                render();
            }
            async function removeBoardOverride(date) {
                if (lv() < 3) return;
                delete D.cleaning.boardDuty.overrides[date];
                await saveCleaning();
                render();
            }
            async function saveBoardAnchor() {
                if (lv() < 3) return alert('선생님 또는 개발자만 수정할 수 있습니다.');
                const date = $('#bd-anchor-date')?.value, idx = Number($('#bd-anchor-name')?.value);
                if (!date || !Number.isInteger(idx)) return alert('기준 날짜와 당번을 선택해 주세요.');
                D.cleaning.boardDuty.anchorDate = date;
                D.cleaning.boardDuty.anchorIdx = idx;
                await saveCleaning();
                alert('칠판 당번 순번 기준을 저장했습니다.');
                render();
            }
            async function addCleaningException() {
                if (lv() < 3) return alert('선생님 또는 개발자만 수정할 수 있습니다.');
                const date = $('#clean-ex-date')?.value;
                const reason = $('#clean-ex-reason')?.value.trim() || '';
                if (!date) return alert('제외할 날짜를 선택해 주세요.');
                const existing = D.cleaning.exceptions.find(x => x.date === date);
                if (existing) existing.reason = reason;
                else D.cleaning.exceptions.push({ date, reason });
                await saveCleaning();
                render();
            }
            async function removeCleaningException(date) {
                if (lv() < 3) return alert('선생님 또는 개발자만 수정할 수 있습니다.');
                D.cleaning.exceptions = D.cleaning.exceptions.filter(x => x.date !== date);
                await saveCleaning();
                render();
            }
            async function sr(id, r) {
                const u = D.users.find(x => x.id == id);
                if (!u)
                    return;
                try {
                    await updateDoc(doc(usersRef, u.uid), {
                        role: r
                    })
                } catch (e) {
                    alert(e.message || '권한을 변경하지 못했습니다.')
                }
            }
            async function updateProfile(id, name) {
                const u = D.users.find(x => x.id == id)
                  , value = name.trim();
                if (!u || !value)
                    return alert('이름을 입력해 주세요.');
                try {
                    await updateDoc(doc(usersRef, u.uid), {
                        name: value
                    })
                } catch (e) {
                    alert(e.message || '이름을 수정하지 못했습니다.')
                }
            }
            function rp() {
                alert('비밀번호 재설정은 Firebase 콘솔의 Authentication → 사용자에서 진행해 주세요.')
            }
            async function du(id) {
                const u = D.users.find(x => x.id == id);
                if (u && confirm('사이트에서 이 계정의 접근을 해제할까요? Firebase Authentication 사용자도 콘솔에서 별도로 삭제해야 합니다.')) {
                    try {
                        await deleteDoc(doc(usersRef, u.uid));
                        await deleteDoc(doc(classroomRef, 'todos', u.uid))
                    } catch (e) {
                        alert(e.message || '계정을 해제하지 못했습니다.')
                    }
                }
            }
            async function bu() {
                const n = $('#an').value.trim()
                  , i = $('#ai').value.trim().toLowerCase()
                  , u = $('#au').value.trim();
                if (!n || !i || !u)
                    return alert('Firebase Authentication에서 만든 계정의 이름, 아이디, UID를 입력해 주세요.');
                if (D.users.some(x => x.id == i || x.uid == u))
                    return alert('이미 등록된 아이디 또는 UID입니다.');
                try {
                    await setDoc(doc(usersRef, u), {
                        uid: u,
                        id: i,
                        name: n,
                        role: $('#br').value,
                        duty: $('#ad').value.trim(),
                        active: true
                    });
                    await setDoc(doc(classroomRef, 'todos', u), {
                        items: []
                    });
                    $('#an').value = '';
                    $('#ai').value = '';
                    $('#au').value = '';
                    $('#ad').value = '';
                    $('#an').focus()
                } catch (e) {
                    alert(e.message || '학생 프로필을 등록하지 못했습니다.')
                }
            }
            async function sd(id, v) {
                const u = D.users.find(x => x.id == id);
                if (!u)
                    return;
                try {
                    await updateDoc(doc(usersRef, u.uid), {
                        duty: v.trim()
                    })
                } catch (e) {
                    alert(e.message || '역할을 저장하지 못했습니다.')
                }
            }
            async function ex() {
                const backup = {
                    users: D.users,
                    events: D.events,
                    roles: D.roles,
                    cleaning: D.cleaning,
                    todos: {}
                };
                if (me.role === 'dev') {
                    const all = await getDocs(collection(classroomRef, 'todos'));
                    all.forEach(d => {
                        backup.todos[D.users.find(u => u.uid === d.id)?.id || d.id] = d.data().items || []
                    }
                    )
                } else
                    backup.todos[me.id] = D.todos[me.uid] || [];
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([JSON.stringify(backup)],{
                    type: 'application/json'
                }));
                a.download = 'class-site-backup.json';
                a.click()
            }
            function im(i) {
                const f = i.files[0];
                if (!f)
                    return;
                const r = new FileReader();
                r.onload = async () => {
                    try {
                        const x = JSON.parse(r.result);
                        if (!Array.isArray(x.users) || !Array.isArray(x.events) || !Array.isArray(x.roles))
                            throw 0;
                        if (!confirm('이전 백업의 일정·역할·할 일을 가져올까요? 같은 아이디의 새 계정이 이미 등록되어 있어야 합니다.'))
                            return;
                        await setDoc(stateRef, {
                            events: x.events,
                            roles: x.roles
                        });
                        await setDoc(cleaningRef, normalizeCleaning(x.cleaning));
                        const byId = new Map(x.users.map(u => [String(u.id).toLowerCase(), u]));
                        for (const u of D.users) {
                            const old = byId.get(u.id.toLowerCase());
                            if (old)
                                await updateDoc(doc(usersRef, u.uid), {
                                    duty: String(old.duty || '')
                                });
                            const items = old ? (x.todos?.[old.id] || []) : [];
                            await setDoc(doc(classroomRef, 'todos', u.uid), {
                                items: Array.isArray(items) ? items : []
                            })
                        }
                        alert('이전 백업을 가져왔습니다. 계정 비밀번호는 이전되지 않습니다.')
                    } catch (e) {
                        alert(e.message || '백업 파일을 가져오지 못했습니다.')
                    } finally {
                        i.value = ''
                    }
                }
                ;
                r.readAsText(f)
            }
            let U = {};
            try {
                U = JSON.parse(localStorage.getItem('classSite_ui')) || {}
            } catch (e) {}
            function applyUI() {
                const r = document.documentElement;
                if (U.t && U.t != 'system')
                    r.dataset.theme = U.t;
                else
                    delete r.dataset.theme;
                r.dataset.fx = U.fx === false ? 'off' : 'on';
                document.querySelectorAll('#sp [data-t]').forEach(b => b.classList.toggle('on', b.dataset.t == (U.t || 'system')));
                $('#fx').checked = U.fx !== false
            }
            function ui() {
                try {
                    localStorage.setItem('classSite_ui', JSON.stringify(U))
                } catch (e) {}
                applyUI()
            }
            const setT = t => {
                U.t = t;
                ui()
            }
              , setFx = v => {
                U.fx = v;
                ui()
            }
              , tp = () => $('#sp').classList.toggle('on');
            document.addEventListener('click', e => {
                if (!e.target.closest('#sp,.fab'))
                    $('#sp').classList.remove('on')
            }
            );
            applyUI();
            let stopState = null
              , stopUsers = null
              , stopTodos = null
              , stopCleaning = null
              , stopNotices = null
              , stopTimetable = null
              , stopBanners = null;
            onAuthStateChanged(auth, user => {
                if (stopState) {
                    stopState();
                    stopState = null
                }
                if (stopUsers) {
                    stopUsers();
                    stopUsers = null
                }
                if (stopTodos) {
                    stopTodos();
                    stopTodos = null
                }
                if (stopCleaning) {
                    stopCleaning();
                    stopCleaning = null
                }
                if (stopBanners) {
                    stopBanners();
                    stopBanners = null;
                }
                if (stopNotices) {
                    stopNotices();
                    stopNotices = null
                }
                if (stopTimetable) {
                    stopTimetable();
                    stopTimetable = null;
                }
                stopSuggestionsSub();
                if (!user) {
                    me = null;
                    NT = [];
                    noticeErr = false;
                    closeNotices();
                    closeOrder();
                    D = {
                        users: [],
                        events: [],
                        roles: [],
                        todos: {},
                        cleaning: emptyCleaning()
                    };
                    render();
                    return
                }
                D = {
                    users: [],
                    events: [],
                    roles: [],
                    todos: {},
                    cleaning: emptyCleaning()
                };
                NT = [];
                BANNERS = [];
                noticeErr = false;
                stopTimetable = onSnapshot(timetableRef, snap => {
                    const saved = snap.exists() ? (snap.data().weeks || {}) : {};
                    TT_DATA = ttNormalize(saved);
                    if (tab === 'timetable') render();
                }, err => {
                    console.error(err);
                    if (tab === 'timetable') {
                        const status = $('#tt-save-status');
                        if (status) status.textContent = '시간표를 불러오지 못했어요. Firestore 읽기 권한을 확인해 주세요.';
                    }
                });
                stopBanners = onSnapshot(query(bannersRef, orderBy('createdAt', 'desc'), limit(50)), snap => {
                    BANNERS = snap.docs.map(d => ({...d.data(), id:d.id}));
                    render();
                }, err => { console.error(err); });
                stopNotices = onSnapshot(query(noticesRef, orderBy('createdAt', 'desc'), limit(50)), snap => {
                    NT = snap.docs.map(d => ({
                        ...d.data(),
                        id: d.id
                    }));
                    noticeErr = false;
                    refreshNotices()
                }
                , err => {
                    console.error(err);
                    noticeErr = true;
                    refreshNotices()
                }
                );
                stopCleaning = onSnapshot(cleaningRef, snap => {
                    D.cleaning = normalizeCleaning(snap.exists() ? snap.data() : {});
                    render();
                    dis();
                }, err => {
                    console.error(err);
                    alert('청소 설정을 읽을 수 없습니다. Firestore 규칙을 확인해 주세요.');
                });
                stopState = onSnapshot(stateRef, snap => {
                    const saved = snap.exists() ? snap.data() : {};
                    D.events = saved.events || [];
                    D.roles = saved.roles || [];
                    render();
                    dis()
                }
                , err => {
                    console.error(err);
                    alert('Firestore 연결을 확인해 주세요.')
                }
                );
                stopUsers = onSnapshot(usersRef, snap => {
                    D.users = snap.docs.map(d => ({
                        ...d.data(),
                        uid: d.id
                    }));
                    me = D.users.find(u => u.uid === user.uid) || null;
                    if (!me) {
                        alert('학생 프로필을 찾을 수 없습니다. 관리자에게 등록을 요청하세요.');
                        signOut(auth);
                        return
                    }
                    startSuggestions();
                    render();
                    dis()
                }
                , err => {
                    console.error(err);
                    alert('프로필을 읽을 수 없습니다. 계정 등록 여부와 Firestore 규칙을 확인해 주세요.');
                    signOut(auth)
                }
                );
                const todosRef = doc(classroomRef, 'todos', user.uid);
                stopTodos = onSnapshot(todosRef, snap => {
                    D.todos[user.uid] = snap.exists() ? (snap.data().items || []) : [];
                    render();
                    dis()
                }
                , err => console.error(err));
            }
            );
            Object.assign(window, {
                tp,
                setT,
                setFx,
                login,
                out,
                cpw,
                go,
                toggleMenu,
                loadMeal,
                ttSetWeek,
                ttAddPeriod,
                ttRemovePeriod,
                ttSave,
                setDday,
                shiftMealDate,
                setMealToday,
                pick,
                mv,
                aev,
                de,
                openAssessment,
                closeAssessment,
                uploadAssessmentPhotos,
                ad,
                tg,
                dl,
                ar,
                as,
                dr,
                sr,
                updateProfile,
                rp,
                du,
                bu,
                sd,
                saveCleaningConfig,
                addCleaningException,
                removeCleaningException,
                addBoardOverride,
                removeBoardOverride,
                saveBoardAnchor,
                ex,
                im,
                openNotices,
                closeNotices,
                addNotice,
                delNotice,
                pickNoticePhotos,
                removeNoticePhoto,
                viewNoticePhoto,
                closeNoticePhoto,
                saveBanner, toggleBanner, editBanner, deleteBanner, toggleBannerVisibility,
                openOrder,
                closeOrder,
                moveCard,
                resetOrder,
                sgSetCat,
                sgSetFilter,
                sgDraftInput,
                sgAnonSet,
                sgSend,
                sgToggle,
                sgDelete
            });
        </script>
    </body>
</html>
