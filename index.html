<!DOCTYPE html>
<html lang="ko" data-view="boot" data-fx="on">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b6e8a">
    <meta name="description" content="마석고등학교 1학년 3반 공지, 시간표, 급식, 청소 당번을 한곳에서 확인하는 학급 사이트">
    <title>우리 반 통합 관리 · 마석고 1-3</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

    <!-- 테마·배경색·글자색·글꼴·첫 화면(로그인/불러오는 중)을 CSS보다 먼저 정해서 깜빡임을 없앱니다. -->
    <script>
        (function () {
            var r = document.documentElement, u = {}, l = {};
            try {
                u = JSON.parse(localStorage.getItem('classSite_ui')) || {};
                l = JSON.parse(localStorage.getItem('classSite_look')) || {};
                r.dataset.view = localStorage.getItem('maseok_session') === '1' ? 'boot' : 'login';
            } catch (e) { r.dataset.view = 'login'; }
            if (u.t && u.t !== 'system') r.dataset.theme = u.t;
            r.dataset.fx = u.fx === false ? 'off' : 'on';
            if (l.a) { r.style.setProperty('--bg-a', l.a); r.style.setProperty('--bg-b', l.b || l.a); }
            if (l.ink) r.style.setProperty('--on-bg', l.ink);
            r.dataset.font = l.font || 'pretendard';
        })();
    </script>

    <!-- 연결을 미리 열어 두면 Firebase·글꼴 응답이 빨라집니다. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://content-firebaseappcheck.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://kschoolinfo.com">
    <link rel="dns-prefetch" href="https://res.cloudinary.com">

    <!-- Pretendard(본문 글꼴): 화면을 막지 않고 불러오고, 늦어도 시스템 글꼴로 먼저 보입니다. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
    <link rel="stylesheet" href="css/style.css">

    <!-- 모듈을 한꺼번에 병렬로 내려받게 해서 'import → import' 줄서기를 없앱니다. -->
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-check.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js">
    <link rel="modulepreload" href="js/firebase.js">
    <link rel="modulepreload" href="js/utils.js">
    <link rel="modulepreload" href="js/store.js">
    <link rel="modulepreload" href="js/dialog.js">
    <link rel="modulepreload" href="js/icons.js">
    <link rel="modulepreload" href="js/theme.js">
    <link rel="modulepreload" href="js/views/today.js">
    <link rel="modulepreload" href="js/views/notices.js">
    <link rel="modulepreload" href="js/views/calendar.js">
    <link rel="modulepreload" href="js/views/cleaning.js">
    <link rel="modulepreload" href="js/views/timetable.js">
    <link rel="modulepreload" href="js/views/meal.js">
    <link rel="modulepreload" href="js/views/suggestions.js">
    <link rel="modulepreload" href="js/views/banners.js">
    <link rel="modulepreload" href="js/views/duty.js">
    <link rel="modulepreload" href="js/views/admin.js">
    <link rel="modulepreload" href="js/views/me.js">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <!-- 배경: 두 색이 천천히 섞이는(디졸브) 층 -->
    <div class="sky" aria-hidden="true"><i></i><i></i></div>

    <!-- 불러오는 중 -->
    <div id="boot" class="boot" role="status">
        <img src="assets/logo.svg" alt="" width="64" height="64">
        <div class="spinner" aria-hidden="true"></div>
        <p>우리 반 정보를 불러오는 중이에요</p>
    </div>

    <!-- 로그인: HTML에 들어 있어서 스크립트가 다 받아지기 전에도 바로 보입니다. -->
    <section id="login" class="login">
        <h1 class="hero-title">2026 마석고등학교 1-3</h1>
        <img class="login-logo" src="assets/logo.svg" alt="" width="72" height="72">
        <form class="card login-card" data-submit="login">
            <h2>우리 반 로그인</h2>
            <label for="li">아이디</label>
            <input id="li" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="영문·숫자" required>
            <label for="lp">비밀번호</label>
            <input id="lp" name="password" type="password" autocomplete="current-password" required>
            <button id="login-btn" disabled>준비 중…</button>
            <p id="login-msg" class="m" role="alert"></p>
            <p class="m">계정은 관리자에게 문의하세요.</p>
        </form>
    </section>

    <!-- 로그인 후 화면 -->
    <div id="shell">
        <header class="top">
            <a class="brand" href="#today">
                <img src="assets/logo.svg" alt="" width="36" height="36">
                <b class="brand-name">마석고 1-3</b>
            </a>
            <div class="top-info">
                <div id="top-weather" class="top-weather" role="status" aria-live="polite" aria-label="마석고등학교 현재 날씨">
                    <span class="weather-icon" aria-hidden="true">🌤️</span><span id="weather-temp">날씨 불러오는 중</span>
                </div>
                <time id="top-clock" class="top-clock" aria-label="현재 시각"></time>
            </div>
            <button type="button" id="top-me" class="me-btn" data-action="openMe" aria-label="내 정보와 화면 설정"></button>
        </header>
        <div class="app">
            <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
            <main id="view" tabindex="-1"></main>
        </div>
    </div>

    <!-- 파일을 더블클릭해서 열면(file://) 브라우저가 JS 모듈을 막습니다. 그때는 안내를 띄웁니다. -->
    <script>
        if (location.protocol === 'file:') {
            var b = document.getElementById('login-btn'), m = document.getElementById('login-msg');
            b.textContent = '서버로 열어야 해요';
            m.textContent = '파일을 직접 열면 브라우저 보안 때문에 작동하지 않아요. 배포된 주소나 VS Code의 Live Server로 열어 주세요.';
        }
    </script>
    <noscript><p class="noscript">이 사이트는 자바스크립트를 켜야 사용할 수 있어요.</p></noscript>
</body>
</html>
